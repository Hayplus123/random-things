<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #game-container {
            width: 800px;
            height: 600px;
            border: 1px solid #000;
            margin: 20px auto;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
    </div>
    <script>
        // Get the canvas element
        var canvas = document.getElementById('game-canvas');
        var ctx = canvas.getContext('2d');

        // Set the canvas dimensions
        canvas.width = 800;
        canvas.height = 600;

        // Define the player class
        class Player {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.speed = 5;
                this.jumpSpeed = 10;
                this.gravity = 0.5;
                this.velocityY = 0;
                this.isJumping = false;
                this.powerUp = null;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 20, 20);
            }

            update() {
                if (this.isJumping) {
                    this.velocityY += this.gravity;
                    this.y += this.velocityY;
                    if (this.y > canvas.height - 20) {
                        this.y = canvas.height - 20;
                        this.isJumping = false;
                        this.velocityY = 0;
                    }
                }
            }

            jump() {
                if (!this.isJumping) {
                    this.isJumping = true;
                    this.velocityY = -this.jumpSpeed;
                }
            }
        }

        // Define the power-up class
        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
            }

            draw() {
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x, this.y, 10, 10);
            }
        }

        // Define the jump pad class
        class JumpPad {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            draw() {
                ctx.fillStyle = 'blue';
                ctx.fillRect(this.x, this.y, 50, 10);
            }
        }

        // Initialize the players, power-ups, and jump pads
        var players = [];
        for (var i = 0; i < 4; i++) {
            players.push(new Player(Math.random() * canvas.width, Math.random() * canvas.height, 'red'));
        }
        var powerUps = [];
        for (var i = 0; i < 10; i++) {
            powerUps.push(new PowerUp(Math.random() * canvas.width, Math.random() * canvas.height, 'speed'));
        }
        var jumpPads = [];
        for (var i = 0; i < 5; i++) {
            jumpPads.push(new JumpPad(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // Main game loop
        var timer = 60; // seconds
        var intervalId = setInterval(function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update and draw players
            for (var i = 0; i < players.length; i++) {
                players[i].update();
                players[i].draw();
            }

            // Update and draw power-ups
            for (var i = 0; i < powerUps.length; i++) {
                powerUps[i].draw();
            }

            // Update and draw jump pads
            for (var i = 0; i < jumpPads.length; i++) {
                jumpPads[i].draw();
            }

            // Check for collisions
            for (var i = 0; i < players.length; i++) {
                for (var j = 0; j < powerUps.length; j++) {
                    if (checkCollision(players[i], powerUps[j])) {
                        // Apply power-up effect
                        if (powerUps[j].type === 'speed') {
                            players[i].speed += 2;
                        }
                        powerUps.splice(j, 1);
                    }
                }
                for (var j = 0; j < jumpPads.length; j++) {
                    if (checkCollision(players[i], jumpPads[j])) {
                        // Apply jump pad effect
                        players[i].jump();
                    }
                }
            }

            // Zoom in and out based on player positions
            var minX = Math.min.apply(null, players.map(function(player) { return player.x; }));
            var maxX = Math.max.apply(null, players.map(function(player) { return player.x; }));
            var minY = Math.min.apply(null, players.map(function(player) { return player.y; }));
            var maxY = Math.max.apply(null, players.map(function(player) { return player.y; }));
            var zoom = Math.min(canvas.width / (maxX - minX), canvas.height / (maxY - minY));
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            // Draw everything again with the new zoom level
            for (var i = 0; i < players.length; i++) {
                players[i].draw();
            }
            for (var i = 0; i < powerUps.length; i++) {
                powerUps[i].draw();
            }
            for (var i = 0; i < jumpPads.length; i++) {
                jumpPads[i].draw();
            }
            ctx.restore();

            // Update timer
            timer--;
            if (timer <= 0) {
                clearInterval(intervalId);
                alert('Game over!');
            }
        }, 1000 / 60);

        // Handle keyboard input
        document.addEventListener('keydown', function(event) {
            if (event.key === ' ') {
                players[0].jump();
            }
        });

        // Check for collisions between two objects
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }
    </script>
</body>
</html>
