<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #game-container {
            width: 800px;
            height: 600px;
            border: 1px solid #000;
            margin: 20px auto;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            border: 1px solid #000;
        }
        #home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        #player-count-input {
            font-size: 24px;
            padding: 10px;
        }
        #play-time-input {
            font-size: 24px;
            padding: 10px;
        }
        #start-button {
            font-size: 24px;
            padding: 10px;
        }
        #game-over-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="home-screen">
            Welcome to Tag Game!
            <br>
            How many players are playing?
            <input id="player-count-input" type="number" min="1" max="4" value="1">
            <br>
            How long do you want to play (in minutes)?
            <input id="play-time-input" type="number" min="1" max="5" value="1">
            <button id="start-button">Start Game</button>
        </div>
        <div id="game-over-message">
            Game Over!
            <br>
            Time's up!
        </div>
    </div>
    <script>
        // Get the canvas element
        var canvas = document.getElementById('game-canvas');
        var ctx = canvas.getContext('2d');

        // Set the canvas dimensions
        canvas.width = 800;
        canvas.height = 600;

        // Define the player class
        class Player {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.speed = 5;
                this.jumpSpeed = 10;
                this.gravity = 0.5;
                this.velocityY = 0;
                this.isJumping = false;
                this.powerUp = null;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 20, 20);
            }

            update() {
                if (this.isJumping) {
                    this.velocityY += this.gravity;
                    this.y += this.velocityY;
                    if (this.y > canvas.height - 20) {
                        this.y = canvas.height - 20;
                        this.isJumping = false;
                        this.velocityY = 0;
                    }
                }
            }

            jump() {
                if (!this.isJumping) {
                    this.isJumping = true;
                    this.velocityY = -this.jumpSpeed;
                }
            }

            moveLeft() {
                this.x -= this.speed;
            }

            moveRight() {
                this.x += this.speed;
            }
        }

        // Define the power-up class
        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
            }

            draw() {
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x, this.y, 10, 10);
            }
        }

        // Define the jump pad class
        class JumpPad {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            draw() {
                ctx.fillStyle = 'blue';
                ctx.fillRect(this.x, this.y, 50, 10);
            }
        }

        // Initialize the players, power-ups, and jump pads
        var players = [];
        var powerUps = [];
        var jumpPads = [];

        // Home screen
        var homeScreen = document.getElementById('home-screen');
        var playerCountInput = document.getElementById('player-count-input');
        var playTimeInput = document.getElementById('play-time-input');
        var startButton = document.getElementById('start-button');
        startButton.addEventListener('click', function() {
            var playerCount = parseInt(playerCountInput.value);
            var playTime = parseInt(playTimeInput.value);
            if (playerCount >= 1 && playerCount <= 4 && playTime >= 1 && playTime <= 5) {
                homeScreen.style.display = 'none';
                initializeGame(playerCount, playTime);
            }
        });

        // Game over message
        var gameOverMessage = document.getElementById('game-over-message');

        // Initialize the game
        function initializeGame(playerCount, playTime) {
            // Initialize the players
            for (var i = 0; i < playerCount; i++) {
                players.push(new Player(Math.random() * canvas.width, Math.random() * canvas.height, 'red'));
            }

            // Initialize the power-ups
            for (var i = 0; i < 10; i++) {
                powerUps.push(new PowerUp(Math.random() * canvas.width, Math.random() * canvas.height, 'speed'));
            }

            // Initialize the jump pads
            for (var i = 0; i < 5; i++) {
                jumpPads.push(new JumpPad(Math.random() * canvas.width, Math.random() * canvas.height));
            }

            // Main game loop
            var timer = playTime * 60; // seconds
            var startTime = new Date().getTime();
            var intervalId = setInterval(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Update and draw players
                for (var i = 0; i < players.length; i++) {
                    players[i].update();
                    players[i].draw();

                    // AI for other players
                    if (i > 0) {
                        if (players[i].x < players[0].x) {
                            players[i].moveRight();
                        } else if (players[i].x > players[0].x) {
                            players[i].moveLeft();
                        }

                        if (Math.random() < 0.1) {
                            players[i].jump();
                        }
                    }
                }

                // Update and draw power-ups
                for (var i = 0; i < powerUps.length; i++) {
                    powerUps[i].draw();
                }

                // Update and draw jump pads
                for (var i = 0; i < jumpPads.length; i++) {
                    jumpPads[i].draw();
                }

                // Check for collisions
                for (var i = 0; i < players.length; i++) {
                    for (var j = 0; j < powerUps.length; j++) {
                        if (checkCollision(players[i], powerUps[j])) {
                            // Apply power-up effect
                            if (powerUps[j].type === 'speed') {
                                players[i].speed += 2;
                            }
                            powerUps.splice(j, 1);
                        }
                    }
                    for (var j = 0; j < jumpPads.length; j++) {
                        if (checkCollision(players[i], jumpPads[j])) {
                            // Apply jump pad effect
                            players[i].jump();
                        }
                    }
                }

                // Update timer
                var currentTime = new Date().getTime();
                var elapsedTime = (currentTime - startTime) / 1000;
                timer = playTime * 60 - Math.floor(elapsedTime);
                ctx.font = '24px Arial';
                ctx.fillStyle = 'black';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText('Time: ' + timer, 10, 10);

                // Game over
                if (timer <= 0) {
                    clearInterval(intervalId);
                    gameOverMessage.style.display = 'block';
                }
            }, 1000 / 60);

            // Handle keyboard input
            document.addEventListener('keydown', function(event) {
                if (event.key === ' ') {
                    players[0].jump();
                } else if (event.key === 'ArrowLeft') {
                    players[0].moveLeft();
                } else if (event.key === 'ArrowRight') {
                    players[0].moveRight();
                }
            });

            // Check for collisions between two objects
            function checkCollision(obj1, obj2) {
                return obj1.x < obj2.x + obj2.width &&
                       obj1.x + obj1.width > obj2.x &&
                       obj1.y < obj2.y + obj2.height &&
                       obj1.y + obj1.height > obj2.y;
            }
        }
    </script>
</body>
</html>
