<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Tag - 1-4 Players</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center}
  #ui{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:24px;background:rgba(13,17,23,0.9);border:1px solid #30363d;border-radius:8px;padding:8px 16px;z-index:100;font-size:14px;font-weight:600;display:none}
  #ui span{display:flex;align-items:center;gap:6px}
  #timer{font-variant-numeric:tabular-nums;font-size:20px;color:#f85149}
  #timer.warning{color:#d29922;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:0.6}}
  #players-info{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .player-tag{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:#21262d;border:1px solid #30363d}
  .player-tag.it{background:#f85149;border-color:#f85149;color:#fff}
  .player-tag .indicator{width:10px;height:10px;border-radius:50%}
  canvas{display:block;background:#161b22}
  #menu{position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:200}
  #menu h1{font-size:48px;font-weight:700;background:linear-gradient(135deg,#58a6ff,#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .menu-panel{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:16px;min-width:320px}
  .menu-row{display:flex;flex-direction:column;gap:8px}
  .menu-row label{font-size:14px;color:#8b949e}
  .menu-row select,.menu-row input[type=range]{padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:16px}
  .menu-row input[type=range]{padding:0}
  .btn{padding:14px 32px;font-size:18px;font-weight:600;background:linear-gradient(135deg,#238636,#2ea043);border:none;border-radius:8px;color:#fff;cursor:pointer;transition:transform .05s,box-shadow .2s}
  .btn:hover{box-shadow:0 0 20px #2ea04380}
  .btn:active{transform:scale(0.98)}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  #gameover{position:fixed;inset:0;background:rgba(13,17,23,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300}
  #gameover h2{font-size:40px}
  #gameover .winner{font-size:28px;font-weight:700}
  .hidden{display:none!important}
  .controls-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:32px;font-size:12px;color:#8b949e;background:rgba(13,17,23,0.8);border:1px solid #30363d;padding:10px 20px;border-radius:8px;display:none;z-index:50}
  .controls-hint kbd{background:#21262d;border:1px solid #30363d;padding:2px 6px;border-radius:4px;font-family:monospace}
</style>
</head>
<body>
<div id="ui">
  <span id="timer">00:00</span>
  <div id="players-info"></div>
</div>
<canvas id="c"></canvas>
<div id="menu">
  <h1>ULTIMATE TAG</h1>
  <div class="menu-panel">
    <div class="menu-row">
      <label>Players (1 Human + Bots)</label>
      <select id="playerCount">
        <option value="2">2 Players (1v1 Bot)</option>
        <option value="3" selected>3 Players (1v2 Bots)</option>
        <option value="4">4 Players (1v3 Bots)</option>
      </select>
    </div>
    <div class="menu-row">
      <label>Time Limit: <span id="timeVal">60</span>s</label>
      <input type="range" id="timeLimit" min="30" max="300" step="15" value="60">
    </div>
    <div class="menu-row">
      <label>Map Size</label>
      <select id="mapSize">
        <option value="small">Small (Arena)</option>
        <option value="medium" selected>Medium (Park)</option>
        <option value="large">Large (City)</option>
      </select>
    </div>
    <button class="btn" id="startBtn">START GAME</button>
  </div>
</div>
<div id="gameover">
  <h2>GAME OVER</h2>
  <div class="winner" id="winnerText"></div>
  <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
</div>
<div class="controls-hint" id="hint">
  <span><kbd>WASD</kbd> / <kbd>Arrows</kbd> Move</span>
  <span><kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> Jump</span>
</div>

<script>
// ===== CONFIG =====
const MAPS = {
  small: {w:1600,h:1000,platforms:[
    {x:0,y:950,w:1600,h:50},
    {x:200,y:750,w:200,h:20},{x:600,y:650,w:200,h:20},{x:1000,y:750,w:200,h:20},{x:1400,y:850,w:200,h:20},
    {x:400,y:450,w:200,h:20},{x:1000,y:450,w:200,h:20},
    {x:700,y:250,w:200,h:20}
  ],jumpPads:[{x:100,y:910,w:80,h:40,power:28},{x:1420,y:810,w:80,h:40,power:28},{x:760,y:210,w:80,h:40,power:32}]},
  medium: {w:2800,h:1600,platforms:[
    {x:0,y:1550,w:2800,h:50},
    {x:100,y:1350,w:250,h:20},{x:500,y:1200,w:250,h:20},{x:1000,y:1350,w:250,h:20},{x:1600,y:1200,w:250,h:20},{x:2200,y:1350,w:250,h:20},{x:2600,y:1450,w:200,h:20},
    {x:300,y:950,w:250,h:20},{x:800,y:800,w:250,h:20},{x:1400,y:950,w:250,h:20},{x:2000,y:800,w:250,h:20},{x:2400,y:950,w:250,h:20},
    {x:600,y:500,w:250,h:20},{x:1500,y:400,w:300,h:20},{x:2200,y:500,w:250,h:20},
    {x:1250,y:100,w:300,h:20}
  ],jumpPads:[
    {x:150,y:1310,w:100,h:40,power:30},{x:2550,y:1410,w:100,h:40,power:30},
    {x:400,y:910,w:100,h:40,power:32},{x:2300,y:910,w:100,h:40,power:32},
    {x:700,y:460,w:100,h:40,power:35},{x:1700,y:460,w:100,h:40,power:35},
    {x:1350,y:60,w:100,h:40,power:40}
  ]},
  large: {w:4000,h:2200,platforms:[
    {x:0,y:2150,w:4000,h:50},
    {x:100,y:1950,w:300,h:20},{x:600,y:1800,w:300,h:20},{x:1200,y:1950,w:300,h:20},{x:1800,y:1800,w:300,h:20},{x:2400,y:1950,w:300,h:20},{x:3000,y:1800,w:300,h:20},{x:3600,y:1950,w:300,h:20},
    {x:300,y:1550,w:300,h:20},{x:1000,y:1400,w:300,h:20},{x:1700,y:1550,w:300,h:20},{x:2400,y:1400,w:300,h:20},{x:3100,y:1550,w:300,h:20},
    {x:500,y:1100,w:300,h:20},{x:1300,y:950,w:300,h:20},{x:2100,y:1100,w:300,h:20},{x:2900,y:950,w:300,h:20},{x:3500,y:1100,w:300,h:20},
    {x:900,y:600,w:300,h:20},{x:1800,y:500,w:400,h:20},{x:2700,y:600,w:300,h:20},
    {x:1500,y:150,w:400,h:20}
  ],jumpPads:[
    {x:180,y:1910,w:120,h:40,power:32},{x:3700,y:1910,w:120,h:40,power:32},
    {x:400,y:1510,w:120,h:40,power:34},{x:3480,y:1510,w:120,h:40,power:34},
    {x:600,y:1060,w:120,h:40,power:36},{x:3280,y:1060,w:120,h:40,power:36},
    {x:1000,y:560,w:120,h:40,power:38},{x:2880,y:560,w:120,h:40,power:38},
    {x:1700,y:110,w:120,h:40,power:42}
  ]}
};

const PLAYER_COLORS = ['#f85149','#58a6ff','#a371f7','#3fb950'];
const PLAYER_NAMES = ['RED','BLUE','PURPLE','GREEN'];
const POWERUP_TYPES = [
  {id:'speed',color:'#ffa657',symbol:'⚡',name:'Speed Boost',duration:8000,effect:p=>p.speedMul=1.6},
  {id:'shield',color:'#58a6ff',symbol:'🛡',name:'Shield',duration:10000,effect:p=>p.shielded=true},
  {id:'jump',color:'#a371f7',symbol:'🦘',name:'Super Jump',duration:8000,effect:p=>p.jumpMul=1.8},
  {id:'shrink',color:'#f85149',symbol:'🔬',name:'Shrink',duration:8000,effect:p=>{p.sizeMul=0.6;p.radius*=0.6}}
];

// ===== GAME STATE =====
let canvas,ctx;
let players=[], platforms=[], jumpPads=[], powerups=[], particles=[];
let camera={x:0,y:0,zoom:1,targetZoom:1};
let gameTime=0, timeLimit=60, gameRunning=false, gameOver=false;
let itIndex=0, playerCount=3, mapSize='medium';
let keys={}, lastTime=0;
const GRAVITY=0.9, FRICTION=0.85, AIR_FRICTION=0.97;
const BASE_SPEED=5.5, BASE_JUMP=22, PLAYER_RADIUS=24;

// ===== DOM =====
const $=id=>document.getElementById(id);
const playerCountSel=$('playerCount'), timeLimitIn=$('timeLimit'), timeVal=$('timeVal'), mapSizeSel=$('mapSize'), startBtn=$('startBtn');
const menu=$('menu'), ui=$('ui'), gameover=$('gameover'), winnerText=$('winnerText'), hint=$('hint'), c=$('c');

// ===== INIT =====
function init(){
  canvas=c; ctx=canvas.getContext('2d');
  resize(); window.addEventListener('resize',resize);
  window.addEventListener('keydown',e=>{keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault()});
  window.addEventListener('keyup',e=>keys[e.code]=false);
  timeLimitIn.addEventListener('input',()=>timeVal.textContent=timeLimitIn.value);
  startBtn.addEventListener('click',startGame);
  requestAnimationFrame(loop);
}
function resize(){
  canvas.width=innerWidth; canvas.height=innerHeight;
}

// ===== GAME START =====
function startGame(){
  playerCount=+playerCountSel.value;
  timeLimit=+timeLimitIn.value;
  mapSize=mapSizeSel.value;
  const map=MAPS[mapSize];
  platforms=map.platforms.map(p=>({...p}));
  jumpPads=map.jumpPads.map(p=>({...p,active:true,cooldown:0}));
  powerups=[]; particles=[]; players=[]; gameTime=timeLimit; gameRunning=true; gameOver=false;
  
  // Spawn players distributed across map
  const spawns = generateSpawns(map, playerCount);
  for(let i=0;i<playerCount;i++){
    const s=spawns[i];
    players.push({
      x:s.x, y:s.y, vx:0, vy:0, radius:PLAYER_RADIUS,
      color:PLAYER_COLORS[i], name:PLAYER_NAMES[i], id:i,
      grounded:false, facing:1,
      speedMul:1, jumpMul:1, sizeMul:1, shielded:false,
      shieldTimer:0, speedTimer:0, jumpTimer:0, shrinkTimer:0,
      isBot:i>0, input:{left:false,right:false,jump:false},
      tagCooldown:0, invuln:0
    });
  }
  itIndex = Math.floor(Math.random()*playerCount);
  players[itIndex].invuln=120; // brief invuln after becoming it
  menu.classList.add('hidden'); ui.classList.remove('hidden'); hint.classList.remove('hidden');
  spawnPowerups(map, 6+playerCount*2);
  lastTime=performance.now(); requestAnimationFrame(loop);
}

// ===== SPAWN LOGIC =====
function generateSpawns(map, count){
  const spots=[];
  // Ground level spawns
  for(let i=0;i<count;i++){
    const x = 200 + (map.w-400) * (i/(count-1 || 1));
    spots.push({x, y: map.h-150});
  }
  // Add some platform spawns for variety
  const platSpawns = map.platforms.filter(p=>p.w>150 && p.y<map.h-200).slice(0,count);
  platSpawns.forEach((p,i)=>{ if(spots[i]) spots[i]={x:p.x+p.w/2, y:p.y-60}; });
  return spots;
}
function spawnPowerups(map, count){
  const validPlats = map.platforms.filter(p=>p.w>100 && p.y<map.h-100);
  for(let i=0;i<count;i++){
    const p = validPlats[Math.floor(Math.random()*validPlats.length)];
    const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
    powerups.push({
      x: p.x + 40 + Math.random()*(p.w-80),
      y: p.y - 40,
      vy: 0, bob: Math.random()*Math.PI*2,
      type, collected:false, respawn:0
    });
  }
}

// ===== MAIN LOOP =====
function loop(now){
  const dt = Math.min(32, now-lastTime)/16.67; // normalized to 60fps
  lastTime = now;
  
  if(gameRunning && !gameOver){
    update(dt);
    gameTime -= dt/60;
    if(gameTime<=0){ endGame(); }
  }
  render();
  requestAnimationFrame(loop);
}

// ===== UPDATE =====
function update(dt){
  // Input - Human player (index 0)
  const human = players[0];
  human.input.left = keys['KeyA']||keys['ArrowLeft'];
  human.input.right = keys['KeyD']||keys['ArrowRight'];
  human.input.jump = (keys['KeyW']||keys['ArrowUp']||keys['Space']) && human.grounded;
  
  // Bot AI
  for(let i=1;i<players.length;i++) updateBot(players[i], dt);
  
  // Physics & movement
  players.forEach(p=>updatePlayer(p, dt));
  
  // Collisions: player-platform
  players.forEach(p=>checkPlatformCollisions(p));
  
  // Jump pads
  players.forEach(p=>checkJumpPads(p));
  
  // Powerups
  updatePowerups(dt);
  players.forEach(p=>checkPowerupCollisions(p));
  
  // Tag logic
  handleTagging();
  
  // Timers
  players.forEach(p=>{
    if(p.tagCooldown>0) p.tagCooldown-=dt;
    if(p.invuln>0) p.invuln-=dt;
    if(p.shieldTimer>0){ p.shieldTimer-=dt; if(p.shieldTimer<=0) p.shielded=false; }
    if(p.speedTimer>0){ p.speedTimer-=dt; if(p.speedTimer<=0) p.speedMul=1; }
    if(p.jumpTimer>0){ p.jumpTimer-=dt; if(p.jumpTimer<=0) p.jumpMul=1; }
    if(p.shrinkTimer>0){ p.shrinkTimer-=dt; if(p.shrinkTimer<=0){ p.sizeMul=1; p.radius=PLAYER_RADIUS; } }
  });
  
  // Camera
  updateCamera();
  
  // Particles
  particles.forEach(pt=>{ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.2; pt.life-=dt; pt.alpha=pt.life/pt.maxLife; });
  particles = particles.filter(pt=>pt.life>0);
}

function updatePlayer(p, dt){
  const speed = BASE_SPEED * p.speedMul;
  const friction = p.grounded ? FRICTION : AIR_FRICTION;
  
  // Horizontal
  if(p.input.left) p.vx -= speed * (p.grounded?1:0.6);
  if(p.input.right) p.vx += speed * (p.grounded?1:0.6);
  p.vx *= friction;
  p.vx = Math.max(-BASE_SPEED*1.8, Math.min(BASE_SPEED*1.8, p.vx));
  p.x += p.vx;
  if(p.vx>0.1) p.facing=1; else if(p.vx<-0.1) p.facing=-1;
  
  // Vertical
  p.vy += GRAVITY;
  if(p.input.jump && p.grounded){
    p.vy = -BASE_JUMP * p.jumpMul;
    p.grounded=false;
    p.input.jump=false;
    spawnJumpParticles(p.x, p.y+p.radius);
  }
  p.y += p.vy;
  
  // World bounds
  const map=MAPS[mapSize];
  if(p.x < p.radius){ p.x=p.radius; p.vx=0; }
  if(p.x > map.w-p.radius){ p.x=map.w-p.radius; p.vx=0; }
  if(p.y > map.h+200){ respawnPlayer(p); }
}

function checkPlatformCollisions(p){
  p.grounded=false;
  platforms.forEach(pl=>{
    if(p.x+p.radius > pl.x && p.x-p.radius < pl.x+pl.w &&
       p.y+p.radius > pl.y && p.y-p.radius < pl.y+pl.h &&
       p.vy > 0 && p.y-p.radius < pl.y + p.vy){
      p.y = pl.y - p.radius;
      p.vy = 0;
      p.grounded = true;
    }
  });
}

function checkJumpPads(p){
  jumpPads.forEach(jp=>{
    if(!jp.active) return;
    if(p.x+p.radius > jp.x && p.x-p.radius < jp.x+jp.w &&
       p.y+p.radius > jp.y && p.y-p.radius < jp.y+jp.h &&
       p.vy > 0){
      p.vy = -jp.power;
      p.grounded=false;
      jp.active=false; jp.cooldown=120;
      spawnJumpPadParticles(jp.x+jp.w/2, jp.y, p.color);
      for(let i=0;i<8;i++) particles.push({
        x:jp.x+jp.w/2, y:jp.y, vx:(Math.random()-0.5)*8, vy:Math.random()*-6-2,
        radius:3+Math.random()*4, color:p.color, life:40, maxLife:40, alpha:1
      });
    }
  });
  jumpPads.forEach(jp=>{ if(jp.cooldown>0){ jp.cooldown--; if(jp.cooldown<=0) jp.active=true; }});
}

function updatePowerups(dt){
  powerups.forEach(pu=>{
    if(pu.collected){
      pu.respawn-=dt;
      if(pu.respawn<=0){
        pu.collected=false;
        pu.y -= 40;
        pu.respawn=0;
      }
      return;
    }
    pu.bob += 0.08*dt;
    pu.y += Math.sin(pu.bob)*0.3;
  });
}

function checkPowerupCollisions(p){
  powerups.forEach(pu=>{
    if(pu.collected) return;
    const dx=p.x-pu.x, dy=p.y-pu.y;
    if(dx*dx+dy*dy < (p.radius+20)*(p.radius+20)){
      pu.collected=true; pu.respawn=1500; // 25 sec respawn
      applyPowerup(p, pu.type);
      spawnCollectParticles(p.x, p.y, pu.type.color);
    }
  });
}

function applyPowerup(p, type){
  type.effect(p);
  if(type.id==='speed') p.speedTimer=type.duration;
  else if(type.id==='shield') p.shieldTimer=type.duration;
  else if(type.id==='jump') p.jumpTimer=type.duration;
  else if(type.id==='shrink') p.shrinkTimer=type.duration;
}

function handleTagging(){
  const it = players[itIndex];
  if(it.tagCooldown>0) return;
  
  for(let i=0;i<players.length;i++){
    if(i===itIndex) continue;
    const other = players[i];
    if(other.invuln>0) continue;
    const dx=it.x-other.x, dy=it.y-other.y;
    const dist=Math.hypot(dx,dy);
    if(dist < it.radius + other.radius){
      // Tag!
      it.tagCooldown=30;
      other.tagCooldown=30;
      const oldIt = itIndex;
      itIndex = i;
      players[oldIt].invuln=60;
      players[itIndex].invuln=120;
      spawnTagParticles((it.x+other.x)/2, (it.y+other.y)/2, it.color);
      break;
    }
  }
}

// ===== BOT AI =====
function updateBot(bot, dt){
  const it = players[itIndex];
  const isIt = bot.id === itIndex;
  const target = isIt ? findNearestPlayer(bot) : findFarthestSafeSpot(bot, it);
  
  if(!target){ bot.input.left=bot.input.right=bot.input.jump=false; return; }
  
  const dx = target.x - bot.x;
  const dy = target.y - bot.y;
  const dist = Math.hypot(dx, dy);
  
  // Horizontal movement
  if(Math.abs(dx) > 20){
    bot.input.left = dx < 0;
    bot.input.right = dx > 0;
  }else{
    bot.input.left = bot.input.right = false;
  }
  
  // Jumping logic
  const canJump = bot.grounded;
  const needsJump = dy < -60 || (dy < -20 && dist < 150) || (isIt && dist < 200 && dy < 30);
  const jumpPadNearby = jumpPads.some(jp=>jp.active && Math.abs(bot.x - (jp.x+jp.w/2)) < 100 && bot.y > jp.y && bot.y - jp.y < 200);
  
  if(canJump && (needsJump || jumpPadNearby)){
    bot.input.jump = true;
  }else{
    bot.input.jump = false;
  }
  
  // Platform navigation - simple: if stuck, jump
  if(bot.grounded && Math.abs(bot.vx) < 0.5 && (bot.input.left||bot.input.right)){
    // Check for wall ahead
    const checkX = bot.x + (bot.facing>0?bot.radius+10:-bot.radius-10);
    const wallAhead = platforms.some(p=> checkX > p.x && checkX < p.x+p.w && bot.y > p.y-10 && bot.y < p.y+20 );
    if(wallAhead) bot.input.jump = true;
  }
}

function findNearestPlayer(bot){
  let nearest=null, bestDist=Infinity;
  players.forEach(p=>{
    if(p.id===bot.id) return;
    const d=Math.hypot(p.x-bot.x, p.y-bot.y);
    if(d<bestDist){ bestDist=d; nearest=p; }
  });
  return nearest;
}

function findFarthestSafeSpot(bot, itPlayer){
  // Find platform farthest from "it" player
  let best=null, bestScore=-Infinity;
  const map=MAPS[mapSize];
  const candidates = [
    ...map.platforms.filter(p=>p.w>100).map(p=>({x:p.x+p.w/2, y:p.y-60})),
    {x:100, y:map.h-150}, {x:map.w-100, y:map.h-150}
  ];
  candidates.forEach(c=>{
    const dFromIt = Math.hypot(c.x-itPlayer.x, c.y-itPlayer.y);
    const dFromBot = Math.hypot(c.x-bot.x, c.y-bot.y);
    // Prefer far from it, not too far from bot, and high up
    const score = dFromIt*1.5 - dFromBot*0.5 + (map.h-c.y)*0.1;
    if(score>bestScore){ bestScore=score; best=c; }
  });
  return best;
}

// ===== CAMERA =====
function updateCamera(){
  if(players.length===0) return;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  players.forEach(p=>{
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
  });
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const spreadX=maxX-minX, spreadY=maxY-minY;
  const padding=120;
  const neededZoomX = canvas.width / (spreadX + padding*2);
  const neededZoomY = canvas.height / (spreadY + padding*2);
  camera.targetZoom = Math.min(1.2, Math.max(0.25, Math.min(neededZoomX, neededZoomY)));
  camera.zoom += (camera.targetZoom - camera.zoom) * 0.08;
  camera.x += (cx - camera.x) * 0.1;
  camera.y += (cy - camera.y) * 0.1;
}

// ===== RENDER =====
function render(){
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Transform
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);
  
  // Background grid
  drawBackground();
  
  // Platforms
  drawPlatforms();
  
  // Jump pads
  drawJumpPads();
  
  // Powerups
  drawPowerups();
  
  // Particles (behind players)
  particles.forEach(drawParticle);
  
  // Players
  players.forEach(p=>drawPlayer(p));
  
  ctx.restore();
  
  // UI overlay (timer, player tags)
  drawUIOverlay();
}

function drawBackground(){
  const map=MAPS[mapSize];
  ctx.strokeStyle='#1f2428'; ctx.lineWidth=1/camera.zoom;
  const step=100;
  for(let x=0;x<=map.w;x+=step){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,map.h); ctx.stroke();
  }
  for(let y=0;y<=map.h;y+=step){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(map.w,y); ctx.stroke();
  }
  // World border
  ctx.strokeStyle='#30363d'; ctx.lineWidth=4/camera.zoom;
  ctx.strokeRect(0,0,map.w,map.h);
}

function drawJumpPads(){
  jumpPads.forEach(jp=>{
    if(!jp.active){
      ctx.fillStyle='#30363d88';
      ctx.fillRect(jp.x, jp.y, jp.w, jp.h);
      return;
    }
    const gradient = ctx.createLinearGradient(jp.x, jp.y, jp.x, jp.y+jp.h);
    gradient.addColorStop(0, '#ff7b00');
    gradient.addColorStop(1, '#cc5500');
    ctx.fillStyle=gradient;
    ctx.beginPath();
    ctx.roundRect(jp.x, jp.y, jp.w, jp.h, 6);
    ctx.fill();
    // Arrow indicator
    ctx.fillStyle='#fff';
    ctx.font = `bold ${jp.h*0.6}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('↑', jp.x+jp.w/2, jp.y+jp.h/2+2);
    // Pulsing glow
    const pulse = 0.5 + 0.5*Math.sin(Date.now()/200);
    ctx.strokeStyle=`rgba(255,123,0,${pulse*0.6})`;
    ctx.lineWidth=3/camera.zoom;
    ctx.stroke();
  });
}

function drawPowerups(){
  powerups.forEach(pu=>{
    if(pu.collected) return;
    const {x,y,type}=pu;
    const r=18;
    // Glow
    const glow = ctx.createRadialGradient(x,y,0,x,y,r*2);
    glow.addColorStop(0, type.color+'80');
    glow.addColorStop(1, type.color+'00');
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(x,y,r*2,0,Math.PI*2); ctx.fill();
    // Main circle
    ctx.fillStyle=type.color;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2/camera.zoom; ctx.stroke();
    // Symbol
    ctx.fillStyle='#fff';
    ctx.font = `bold ${r*0.9}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(type.symbol, x, y+1);
  });
}

function drawParticle(pt){
  ctx.globalAlpha=pt.alpha;
  ctx.fillStyle=pt.color;
  ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.radius,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
}

function drawPlayer(p){
  const r = p.radius;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y+r*0.9, r*0.7, r*0.2, 0,0,Math.PI*2); ctx.fill();
  
  // Shield effect
  if(p.shielded){
    const t=Date.now()/100;
    ctx.strokeStyle=`rgba(88,166,255,${0.4+0.3*Math.sin(t)})`;
    ctx.lineWidth=3/camera.zoom;
    ctx.beginPath(); ctx.arc(p.x,p.y,r+8+2*Math.sin(t),0,Math.PI*2); ctx.stroke();
  }
  
  // Body (SVG-style using canvas path)
  const bodyGrad = ctx.createRadialGradient(p.x-r*0.3, p.y-r*0.3, 0, p.x, p.y, r);
  bodyGrad.addColorStop(0, lightenColor(p.color, 40));
  bodyGrad.addColorStop(1, p.color);
  ctx.fillStyle=bodyGrad;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
  
  // Outline
  ctx.strokeStyle=darkenColor(p.color, 30);
  ctx.lineWidth=2.5/camera.zoom;
  ctx.stroke();
  
  // Eye(s) - direction indicator
  const eyeOffset = r*0.35;
  const eyeY = p.y - r*0.1;
  ctx.fillStyle='#1a1a1a';
  // Main eye
  ctx.beginPath(); ctx.arc(p.x + p.facing*eyeOffset, eyeY, r*0.18, 0, Math.PI*2); ctx.fill();
  // Pupil
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(p.x + p.facing*(eyeOffset+r*0.06), eyeY, r*0.07, 0, Math.PI*2); ctx.fill();
  // Second eye (smaller)
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.arc(p.x - p.facing*eyeOffset*0.5, eyeY, r*0.12, 0, Math.PI*2); ctx.fill();
  
  // "IT" indicator - triangle above head
  if(p.id === itIndex){
    const triY = p.y - r - 14;
    const pulse = 1 + 0.15*Math.sin(Date.now()/100);
    ctx.fillStyle='#f85149';
    ctx.beginPath();
    ctx.moveTo(p.x, triY - 10*pulse);
    ctx.lineTo(p.x - 10*pulse, triY + 2*pulse);
    ctx.lineTo(p.x + 10*pulse, triY + 2*pulse);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2/camera.zoom; ctx.stroke();
    // "IT" text
    ctx.fillStyle='#f85149';
    ctx.font = `bold ${12/camera.zoom}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('IT', p.x, triY - 14*pulse);
  }
  
  // Powerup indicators
  let iconY = p.y - r - 28;
  if(p.shielded){ drawIcon(p.x, iconY, '🛡', '#58a6ff'); iconY -= 18; }
  if(p.speedMul>1){ drawIcon(p.x, iconY, '⚡', '#ffa657'); iconY -= 18; }
  if(p.jumpMul>1){ drawIcon(p.x, iconY, '🦘', '#a371f7'); iconY -= 18; }
}

function drawIcon(x, y, emoji, color){
  ctx.fillStyle=color;
  ctx.font = `${14/camera.zoom}px Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(emoji, x, y);
}

function drawUIOverlay(){
  // Timer
  const t = Math.max(0, Math.ceil(gameTime));
  const m = Math.floor(t/60), s = t%60;
  const timerEl = $('timer');
  timerEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  timerEl.classList.toggle('warning', t<=10);
  
  // Player tags
  const info = $('players-info');
  info.innerHTML = players.map((p,i)=>`
    <div class="player-tag ${p.id===itIndex?'it':''}">
      <span class="indicator" style="background:${p.color}"></span>
      ${p.name}${i===0?' (YOU)':''}
    </div>
  `).join('');
}

function spawnJumpParticles(x,y){
  for(let i=0;i<6;i++) particles.push({
    x,y, vx:(Math.random()-0.5)*6, vy:Math.random()*-4-1,
    radius:2+Math.random()*3, color:'#888', life:30, maxLife:30, alpha:1
  });
}

function spawnJumpPadParticles(x,y,color){
  for(let i=0;i<12;i++) particles.push({
    x,y, vx:(Math.random()-0.5)*10, vy:Math.random()*-8-2,
    radius:3+Math.random()*4, color, life:50, maxLife:50, alpha:1
  });
}

function spawnCollectParticles(x,y,color){
  for(let i=0;i<15;i++) particles.push({
    x,y, vx:(Math.random()-0.5)*12, vy:Math.random()*-10-2,
    radius:3+Math.random()*5, color, life:60, maxLife:60, alpha:1
  });
}

function spawnTagParticles(x,y,color){
  for(let i=0;i<20;i++) particles.push({
    x,y, vx:(Math.random()-0.5)*15, vy:Math.random()*-12-3,
    radius:4+Math.random()*6, color, life:70, maxLife:70, alpha:1
  });
  // Screen shake
  camera.x += (Math.random()-0.5)*30;
  camera.y += (Math.random()-0.5)*20;
}

function respawnPlayer(p){
  const map=MAPS[mapSize];
  p.x = 100 + Math.random()*(map.w-200);
  p.y = map.h - 200;
  p.vx = p.vy = 0;
  p.invuln = 180;
}

function endGame(){
  gameRunning=false; gameOver=true;
  const loser = players[itIndex];
  const winners = players.filter(p=>p.id!==itIndex);
  winnerText.innerHTML = `
    <span style="color:${loser.color}">${loser.name}</span> was IT when time ran out!<br>
    <span style="color:#3fb950">${winners.map(w=>w.name).join(', ')}</span> ${winners.length===1?'wins':'win'}!
  `;
  ui.classList.add('hidden'); hint.classList.add('hidden'); gameover.classList.remove('hidden');
}

// Color helpers
function lightenColor(hex, amt){
  const num=parseInt(hex.slice(1),16), r=(num>>16)+amt, g=((num>>8)&255)+amt, b=(num&255)+amt;
  return '#'+(0x1000000+Math.min(255,r)*0x10000+Math.min(255,g)*0x100+Math.min(255,b)).toString(16).slice(1);
}
function darkenColor(hex, amt){
  const num=parseInt(hex.slice(1),16), r=(num>>16)-amt, g=((num>>8)&255)-amt, b=(num&255)-amt;
  return '#'+(0x1000000+Math.max(0,r)*0x10000+Math.max(0,g)*0x100+Math.max(0,b)).toString(16).slice(1);
}
